# boblbee tmux configuration
# This file loads base behaviors + current theme
# Installed by scripts/tmux-sync.sh

# Load base configuration (behaviors)
source-file -q ~/.config/tmux/tmux-base.conf

# Load current theme (prefix + T to toggle, or change this line)
# Options: tmux-theme-dark.conf, tmux-theme-dark.conf
source-file -q ~/.config/tmux/tmux-theme-dark.conf

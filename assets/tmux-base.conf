# boblbee tmux configuration - Base behaviors (theme-agnostic)
# Screen-friendly version with forgiving timings

set-option -g prefix C-b
bind-key C-b send-prefix

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Enable mouse support — wheel scrollback, click-to-focus, drag-to-resize.
set -g mouse on

# Make a plain drag always start a tmux selection, even over a full-screen app.
#
# Claude Code and other alt-screen apps turn on mouse reporting, so tmux's
# default MouseDrag1Pane forwards the drag to the app and select-to-copy never
# fires — leaving ghostty's shift-drag as the only escape hatch, which is
# clunky. Wheel bindings are deliberately left at their defaults so scrolling
# still reaches the app: that is what scrolls the Claude Code transcript.
bind-key -T root MouseDrag1Pane if-shell -F '#{pane_in_mode}' 'send-keys -M' 'copy-mode -M'

# Toggle tmux's mouse capture (prefix + m). Off hands drags back to ghostty,
# which brings back its copy-on-select toast and leaves the text highlighted —
# at the cost of the wheel, click-to-focus and drag-to-resize. Ghostty only
# runs its own selection layer when no mouse reporting is active at all, so the
# two cannot both be true; this is the switch between them.
bind m if-shell -F '#{mouse}' \
    'set -g mouse off ; display-message -d 2000 "Mouse OFF — ghostty owns selection, no wheel"' \
    'set -g mouse on  ; display-message -d 2000 "Mouse ON — tmux owns wheel, clicks and drag"'

# Push copies out to the outer terminal's clipboard via OSC 52, and accept
# OSC 52 from apps inside tmux (Claude Code's own drag-copy relies on this).
set -g set-clipboard on

# Don't rename windows automatically
set-option -g allow-rename off

# Two-line status bar
set -g status 2

# Centre window list in status bar
set -g status-justify centre

# Increase scrollback buffer size
set-option -g history-limit 50000

# Display messages for 3 seconds
set-option -g display-time 3000

# Refresh status more often
set-option -g status-interval 5

# Focus events for vim
set-option -g focus-events on

# Enable 256 colors + truecolor (tmux-256color fixes mouse-mode reset on unclean app exit)
# Guarded: fall back to screen-256color if the terminfo entry is absent (avoids startup failure)
if-shell 'infocmp tmux-256color > /dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -ga terminal-overrides ",*256col*:Tc"

# Declare OSC 52 support for the outer terminal even when its terminfo doesn't.
# xterm* already carries the clipboard feature, but a nested tmux presents
# itself as screen*/tmux*, which only gets "title" — and then copies stop
# reaching the system clipboard.
set -as terminal-features ',*:clipboard'

# Split panes using | and - (intuitive!)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config file with confirmation that stays visible
bind r source-file ~/.tmux.conf \; display-message -d 3000 "Config reloaded!"

# Toggle between light and dark themes (prefix + t)
bind t run-shell ' \
  if grep -q "tmux-theme-light.conf" ~/.tmux.conf; then \
    sed "s/tmux-theme-light.conf/tmux-theme-dark.conf/" ~/.tmux.conf > ~/.tmux.conf.tmp \
    && mv ~/.tmux.conf.tmp ~/.tmux.conf \
    && tmux source-file ~/.tmux.conf \
    && tmux display-message -d 3000 "Switched to dark theme"; \
  else \
    sed "s/tmux-theme-dark.conf/tmux-theme-light.conf/" ~/.tmux.conf > ~/.tmux.conf.tmp \
    && mv ~/.tmux.conf.tmp ~/.tmux.conf \
    && tmux source-file ~/.tmux.conf \
    && tmux display-message -d 3000 "Switched to light theme"; \
  fi'

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Arrow keys with prefix
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

# Resize panes with Shift+Arrow
bind -r S-Left resize-pane -L 5
bind -r S-Down resize-pane -D 5
bind -r S-Up resize-pane -U 5
bind -r S-Right resize-pane -R 5

# Use emacs mode for command line
set-option -g status-keys emacs
setw -g mode-keys emacs

# Copy on drag-end, but keep the evidence: copy-selection-and-cancel dropped the
# highlight and exited copy-mode the instant it copied, so there was nothing to
# show the copy had happened. -no-clear leaves the text lit and the status line
# says so. Press q or Escape to leave copy-mode.
bind-key -T copy-mode MouseDragEnd1Pane \
    send-keys -X copy-selection-no-clear \; \
    display-message -d 1500 "Copied #{buffer_size} chars"

# Activity monitoring
# monitor-activity still flags windows (window-status-activity-style), but
# visual-activity is off: the transient status-bar flash is redundant now
# that a bell raises a persistent dot, and the flash fired on bell anyway
# (the bell's pane output trips activity monitoring).
setw -g monitor-activity on
set -g visual-activity off
# Bell behaviour is set below in the "Claude Code attention signal" block

# Renumber windows when one is closed
set -g renumber-windows on

# Time to press escape sequences (50ms)
set -sg escape-time 50

# Time for repeatable commands (800ms)
set -g repeat-time 800

# Show pane numbers for longer when selecting
set -g display-panes-time 3000

# Easier window navigation (like screen)
bind C-b last-window
bind Space next-window
bind BSpace previous-window

# More forgiving confirmation prompts
bind-key k confirm-before -p "kill-window #W? (y/n)" kill-window
bind-key x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# Easy session switching
bind-key s choose-session

# Helpful key binding to show all key bindings
bind ? list-keys

# Clear scrollback buffer (useful!)
bind C-l clear-history \; display-message -d 2000 "History cleared"

# --- Claude Code attention signal -----------------------------------------
# Let Claude Code's bell (and its notifications/progress) escape tmux
set -g allow-passthrough on

# When a background window rings the bell, flag it in the status bar
# instead of beeping or printing a message. The persistent dot indicator
# next to the window name is drawn per-theme via #{?window_bell_flag,...}
# in window-status-format (see tmux-theme-{dark,light}.conf), because the
# themes' hardcoded fg/bg would otherwise override window-status-bell-style.
set -g monitor-bell on
set -g bell-action other
set -g visual-bell off
set -g window-status-bell-style 'fg=red,bold'
# --------------------------------------------------------------------------

# --- Nested tmux: F12 makes the outer tmux transparent --------------------
# SSHing into a remote host from inside local tmux nests two tmuxes, and the
# outer one eats every C-b. F12 turns off all key handling in the tmux the
# terminal is attached to, so the prefix and every other binding reach the
# inner tmux. F12 again re-enables it.
# While off, the entire outer theme fades to flat grey (both status lines,
# window list, borders). The themes hardcode colors inside their format
# strings, so the formats are overridden wholesale here; F12-restore
# re-sources ~/.tmux.conf to hand the globals back to the active theme.
# Prefix/key-table are session-scoped so only this session goes pass-through.
bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set -g status-style 'bg=#555555,fg=#999999' \;\
    set -g status-left '#[fg=#bbbbbb,bg=#555555,bold] #S #[fg=#777777,nobold]| #[fg=#999999]#(whoami) ' \;\
    set -g status-right ' #[fg=#999999,bg=#555555]F12 returns #[fg=#777777]| #[fg=#bbbbbb,bold]#H ' \;\
    setw -g window-status-current-format '#[fg=#cccccc,bg=#555555,bold] #I: #W#{?window_bell_flag,#[fg=#996666] ●,} #[nobold]' \;\
    setw -g window-status-format '#[fg=#888888,bg=#555555] #I: #W#{?window_bell_flag,#[fg=#996666] ●,} ' \;\
    set -g status-format[1] '#[fill=#4a4a4a]' \;\
    set -g pane-border-style fg='#4a4a4a' \;\
    set -g pane-active-border-style fg='#777777' \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    source-file ~/.tmux.conf \;\
    refresh-client -S
# --------------------------------------------------------------------------
